
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>મોહબ્બત ખપે રેડિયો</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:#fff;
 background:linear-gradient(145deg,#160d24,#3b1745,#101827);
 min-height:100vh;
 text-align:center;
}
header{padding:25px 12px 10px}
header h1{font-size:30px;color:#ffd477;margin:8px 0}
header p{color:#f5d9ec}
.radio{
 max-width:440px;
 margin:20px auto;
 padding:22px;
 background:linear-gradient(145deg,#4a263b,#21152d);
 border:2px solid #c18a55;
 border-radius:25px;
 box-shadow:0 12px 35px #0008;
}
.dial{
 width:190px;height:190px;border-radius:50%;
 margin:10px auto 20px;
 border:8px solid #d9a85d;
 background:radial-gradient(circle,#693b65,#21152d);
 display:flex;align-items:center;justify-content:center;
 font-size:65px;
}
#status{color:#ffd477;margin:12px 0}
#songTitle{font-size:19px;min-height:28px}
button{
 border:0;border-radius:25px;padding:12px 18px;
 margin:5px;background:#e5ae63;color:#241426;
 font-weight:bold;font-size:15px;cursor:pointer;
}
button:active{transform:scale(.96)}
.mainbtn{background:#ffcf75;font-size:18px}
audio{width:100%;margin:15px 0}
.panel{
 max-width:440px;margin:20px auto;padding:18px;
 background:#21182d;border:1px solid #9d6a82;
 border-radius:18px;
}
input{
 width:100%;padding:12px;margin:7px 0;
 border:1px solid #bd8d9f;border-radius:9px;
 font-size:15px;
}
.song{
 padding:12px;margin:8px 0;background:#382640;
 border-radius:10px;text-align:left;
}
.song button{float:right;padding:7px 11px}
.small{font-size:12px;color:#d9c5d9}
.hidden{display:none}
footer{padding:25px;color:#d8c1d7}
</style>
</head>
<body>

<header>
<h1>❤️ મોહબ્બત ખપે રેડિયો ❤️</h1>
<p>જૂનાં ગીતો • ગઝલ • સંગીતની યાદો</p>
</header>

<section class="radio">
 <div class="dial">📻</div>
 <div id="status">રેડિયો તૈયાર છે</div>
 <div id="songTitle">કોઈ ગીત પસંદ કરો</div>

 <audio id="player" controls preload="none"></audio>

 <div>
  <button onclick="previousSong()">⏮ પાછલું</button>
  <button class="mainbtn" onclick="togglePlay()">▶ Play / Pause</button>
  <button onclick="nextSong()">આગળ ⏭</button>
 </div>
 <p class="small">તમારા મનપસંદ સંગીતનો સાથ</p>
</section>

<section class="panel">
 <h2>🎵 ગીતોની યાદી</h2>
 <div id="songList">હજુ ગીત ઉમેર્યાં નથી.</div>
</section>

<section class="panel">
 <h2>🔐 Admin Panel</h2>
 <div id="loginBox">
  <input id="password" type="password" placeholder="Admin પાસવર્ડ">
  <button onclick="login()">Admin Login</button>
 </div>

 <div id="adminBox" class="hidden">
  <input id="newTitle" placeholder="ગીતનું નામ">
  <input id="newUrl" type="url" placeholder="ગીતની MP3 URL">
  <button onclick="addSong()">ગીત ઉમેરો</button>
  <button onclick="logout()">Logout</button>
  <p class="small">
   નોંધ: MP3 URL સીધી ચાલે તેવી HTTPS લિંક હોવી જોઈએ.
  </p>
 </div>
</section>

<footer>
❤️ મોહબ્બત ખપે રેડિયો ❤️<br>
સંગીત સાથે યાદગાર પળો
</footer>

<script>
const ADMIN_PASSWORD = "asif123";

let songs = [];
let currentIndex = -1;

const player = document.getElementById("player");
const songTitle = document.getElementById("songTitle");
const statusText = document.getElementById("status");
const songList = document.getElementById("songList");

function renderSongs(){
 songList.innerHTML = "";

 if(songs.length === 0){
  songList.textContent = "હજુ ગીત ઉમેર્યાં નથી.";
  return;
 }

 songs.forEach((song,index)=>{
  const div = document.createElement("div");
  div.className = "song";

  const name = document.createElement("span");
  name.textContent = (index+1)+". "+song.title;

  const playBtn = document.createElement("button");
  playBtn.textContent = "▶";
  playBtn.onclick = ()=>playSong(index);

  div.appendChild(name);
  div.appendChild(playBtn);

  if(!document.getElementById("adminBox").classList.contains("hidden")){
   const delBtn = document.createElement("button");
   delBtn.textContent = "કાઢો";
   delBtn.onclick = ()=>deleteSong(index);
   div.appendChild(delBtn);
  }

  songList.appendChild(div);
 });
}

function playSong(index){
 if(index < 0 || index >= songs.length) return;

 currentIndex = index;
 player.src = songs[index].url;
 songTitle.textContent = songs[index].title;
 statusText.textContent = "ગીત વાગી રહ્યું છે...";

 player.play().catch(()=>{
  statusText.textContent = "ગીત ચાલુ ન થયું. MP3 URL તપાસો.";
 });
 renderSongs();
}

function togglePlay(){
 if(!player.src){
  statusText.textContent = "પહેલાં ગીત પસંદ કરો.";
  return;
 }

 if(player.paused){
  player.play().catch(()=>statusText.textContent="Play થઈ શક્યું નથી.");
 }else{
  player.pause();
 }
}

function nextSong(){
 if(songs.length === 0) return;
 playSong((currentIndex+1)%songs.length);
}

function previousSong(){
 if(songs.length === 0) return;
 playSong((currentIndex-1+songs.length)%songs.length);
}

player.addEventListener("ended",nextSong);

function login(){
 const pass = document.getElementById("password").value;

 if(pass === ADMIN_PASSWORD){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");
  statusText.textContent = "Admin Login સફળ";
  renderSongs();
 }else{
  alert("ખોટો પાસવર્ડ");
 }
}

function logout(){
 document.getElementById("adminBox").classList.add("hidden");
 document.getElementById("loginBox").classList.remove("hidden");
 document.getElementById("password").value = "";
 renderSongs();
}

function addSong(){
 const title = document.getElementById("newTitle").value.trim();
 const url = document.getElementById("newUrl").value.trim();

 if(!title || !url){
  alert("ગીતનું નામ અને MP3 URL બંને નાખો.");
  return;
 }

 try{
  const parsed = new URL(url);
  if(parsed.protocol !== "https:"){
   alert("HTTPS URL જ વાપરો.");
   return;
  }
 }catch(e){
  alert("યોગ્ય URL નાખો.");
  return;
 }

 songs.push({title,url});
 document.getElementById("newTitle").value = "";
 document.getElementById("newUrl").value = "";
 renderSongs();
 alert("ગીત ઉમેરાયું.");
}

function deleteSong(index){
 if(!confirm("આ ગીત કાઢવું છે?")) return;

 songs.splice(index,1);

 if(currentIndex === index){
  player.pause();
  player.removeAttribute("src");
  player.load();
  currentIndex = -1;
  songTitle.textContent = "કોઈ ગીત પસંદ કરો";
  statusText.textContent = "ગીત કાઢી નાખ્યું.";
 }else if(currentIndex > index){
  currentIndex--;
 }

 renderSongs();
}

renderSongs();
</script>
</body>
</html>
